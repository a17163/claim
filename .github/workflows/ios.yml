name: iOS WDA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios_tunnel/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
      # The Bugly App ID ships inside every IPA, so a repository secret only overrides it.
      BUGLY_APP_ID: ${{ secrets.BUGLY_APP_ID || '13ca0bce9b' }}
      # The App Key is only used to upload symbols, so it stays a secret.
      BUGLY_APP_KEY: ${{ secrets.BUGLY_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check phone claim and tunnel logic
        run: |
          clang -fobjc-arc -framework Foundation ios_tunnel/test_claim_loop.m -o "$RUNNER_TEMP/test_claim_loop"
          "$RUNNER_TEMP/test_claim_loop"
          clang -fobjc-arc -framework Foundation -framework Security -framework CoreGraphics -framework ImageIO -framework Network ios_tunnel/test_tunnel.m -o "$RUNNER_TEMP/test_tunnel"
          "$RUNNER_TEMP/test_tunnel"
      - name: Prepare WDA source
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output wda.tgz https://registry.npmjs.org/appium-webdriveragent/-/appium-webdriveragent-16.17.9.tgz
          echo 'aeb1a06dead51467b87d7103fa74827fd9f967a60b47255164fde0168fc4810a  wda.tgz' | shasum -a 256 -c
          tar -xzf wda.tgz
          python3 "$GITHUB_WORKSPACE/ios_tunnel/prepare_wda.py" --wda-source "$RUNNER_TEMP/package"
      - name: Fetch Bugly crash SDK
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output bugly.zip \
            https://buglycocoapodscrashsdk-75649.gzc.vod.tencent-cloud.com/Bugly-2.6.1.zip
          echo '445fbc683fc8c7d7a978eed80a8e35b7cbf74586f8fd879e1838b9387e1f9e2e  bugly.zip' | shasum -a 256 -c
          mkdir -p bugly
          unzip -qo bugly.zip -d bugly -x '__MACOSX/*'
          test -f bugly/Bugly.framework/Bugly
      - name: Build unsigned WDA runner
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -quiet -project "$RUNNER_TEMP/package/WebDriverAgent.xcodeproj" \
            -scheme WebDriverAgentRunner -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/wda-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            FRAMEWORK_SEARCH_PATHS="\$(inherited) $RUNNER_TEMP/bugly" \
            OTHER_LDFLAGS="\$(inherited) -framework Bugly -lz -lc++" \
            OTHER_CFLAGS="\$(inherited) -Wno-quoted-include-in-framework-header -Wno-documentation -Wno-objc-property-assign-on-object-type" \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/wda-build.log"
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          runner_app="$RUNNER_TEMP/Payload/WDA-Remote.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$RUNNER_TEMP/wda-build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app" \
            "$runner_app"
          # Xcode's build-for-testing omits these two XCTest dependencies on iOS 16.
          ios_dev="$(xcrun --sdk iphoneos --show-sdk-platform-path)/Developer"
          ditto --norsrc "$ios_dev/usr/lib/lib_TestingInterop.dylib" "$runner_app/Frameworks/lib_TestingInterop.dylib"
          ditto --norsrc "$ios_dev/Library/Frameworks/_Testing_Foundation.framework" \
            "$runner_app/Frameworks/_Testing_Foundation.framework"
          pair_config="$runner_app/PlugIns/WebDriverAgentRunner.xctest/FBRemoteTunnel.plist"
          /usr/libexec/PlistBuddy -c 'Add :Enabled bool true' \
            -c 'Add :EnrollmentOrigin string https://wda.trxbi.com' "$pair_config"
          # Bugly stays off unless an App ID is supplied.
          if [ -n "$BUGLY_APP_ID" ]; then
            /usr/libexec/PlistBuddy \
              -c "Add :AppId string $BUGLY_APP_ID" \
              -c 'Add :Channel string wda-ios' \
              "$runner_app/PlugIns/WebDriverAgentRunner.xctest/FBBugly.plist"
            echo "Crash reporting enabled." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'No App ID; crash reporting stays disabled.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # iOS attributes the wireless-data permission to the record of the running
          # test bundle, so name it like the app instead of WebDriverAgentRunner-Runner.
          test_info="$runner_app/PlugIns/WebDriverAgentRunner.xctest/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string WDA Remote' \
            -c 'Set :CFBundleName WDA Remote' \
            -c "Set :CFBundleVersion 1.${{ github.run_number }}" "$test_info"
          # Keep the fallback name consistent when a signing tool repackages the app.
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string WDA Remote' \
            -c 'Set :CFBundleName WDA Remote' \
            -c "Set :CFBundleVersion 1.${{ github.run_number }}" "$runner_app/Info.plist"
          python3 - "$runner_app" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          settings = Path(sys.argv[1]) / 'Settings.bundle'
          settings.mkdir()
          (settings / 'Root.plist').write_bytes(plistlib.dumps({
              'PreferenceSpecifiers': [
                  {'Type': 'PSGroupSpecifier', 'Title': 'WDA Remote',
                   'FooterText': '在网页控制台生成配对码，填入后启动 WDA。'},
                  {'Type': 'PSTextFieldSpecifier', 'Title': '配对码', 'Key': 'WalletClickPairCode',
                   'DefaultValue': '', 'IsSecure': True, 'AutocapitalizationType': 'None',
                   'AutocorrectionType': 'No'},
              ],
          }))
          PY
          cd "$RUNNER_TEMP"
          zip -qry WDA-Remote-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WDA-iOS-unsigned-IPA
          path: ${{ runner.temp }}/WDA-Remote-unsigned.ipa
          if-no-files-found: error
      - name: Collect dSYM
        shell: bash
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/wda-build/Build/Products/Debug-iphoneos"
          mkdir -p "$RUNNER_TEMP/dsym" "$RUNNER_TEMP/dsym-raw"
          while IFS= read -r -d '' item; do
            name="$(basename "$item")"
            ditto -c -k --keepParent "$item" "$RUNNER_TEMP/dsym/$name.zip"
            cp -R "$item" "$RUNNER_TEMP/dsym-raw/$name"
          done < <(find "$products" -name '*.dSYM' -maxdepth 6 -print0)
          dwarfdump --uuid "$RUNNER_TEMP"/dsym-raw/*.dSYM | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Upload dSYM to Bugly
        if: env.BUGLY_APP_KEY != ''
        shell: bash
        run: |
          set -o pipefail
          java -jar ios_tunnel/tools/buglyqq-upload-symbol.jar \
            -appid "$BUGLY_APP_ID" \
            -appkey "$BUGLY_APP_KEY" \
            -bundleid com.walletclick.wda.s4rnp6ldd6.xctrunner \
            -version "1.${{ github.run_number }}" \
            -platform IOS \
            -inputSymbol "$RUNNER_TEMP/dsym-raw" 2>&1 | tee "$RUNNER_TEMP/bugly-upload.log"
          grep -q '200' "$RUNNER_TEMP/bugly-upload.log" || {
            echo 'Bugly upload did not report 200.' >&2
            exit 1
          }
      - name: Upload dSYM for Bugly symbolication
        uses: actions/upload-artifact@v4
        with:
          name: WDA-iOS-dSYM
          path: ${{ runner.temp }}/dsym/*.zip
          if-no-files-found: warn
          retention-days: 30
      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WDA-iOS-build-log
          path: ${{ runner.temp }}/wda-build.log
          if-no-files-found: ignore
          retention-days: 7
